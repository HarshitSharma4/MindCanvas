services:
  db:
    image: pgvector/pgvector:pg16
    container_name: mindcanvas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mindcanvas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mindcanvas_dev}
      POSTGRES_DB: ${POSTGRES_DB:-mindcanvas}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./supabase/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/01_initial_schema.sql
      - ./supabase/seed.sql:/docker-entrypoint-initdb.d/99_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mindcanvas}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: mindcanvas-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mindcanvas}:${POSTGRES_PASSWORD:-mindcanvas_dev}@db:5432/${POSTGRES_DB:-mindcanvas}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-mindcanvas}:${POSTGRES_PASSWORD:-mindcanvas_dev}@db:5432/${POSTGRES_DB:-mindcanvas}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/v1/calendar/callback}
      AI_PROVIDER: ${AI_PROVIDER:-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
      - /app/__pycache__
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: mindcanvas-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    working_dir: /app
    command: npm run dev

volumes:
  pgdata:
